<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>BusGo | You're offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; padding: 24px; }
    .card { max-width: 420px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 40px 28px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { margin: 20px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #64748b; line-height: 1.5; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="BusGo" />
    <h1>You're offline</h1>
    <p>BusGo can't reach the internet right now. Check your connection and try again. Pages you've already visited may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
